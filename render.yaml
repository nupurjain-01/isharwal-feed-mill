services:
  - type: web
    name: isharwal-feed-mill
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: COMPANY_NAME
        value: ISHARWAL FEED MILL
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: isharwal-central-db
          property: connectionString

databases:
  - name: isharwal-central-db
    plan: free
    region: oregon
    databaseName: isharwal_gate_db
    user: isharwal_admin
